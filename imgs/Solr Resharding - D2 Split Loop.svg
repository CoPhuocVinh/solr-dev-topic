<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="820" viewBox="0 0 1900 820">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <style>.title{font:700 24px Arial;fill:#111827}.box{fill:#e8f7e8;stroke:#1f2937;stroke-width:2}.gate{fill:#fef3c7;stroke:#92400e;stroke-width:2}.error{fill:#fee2e2;stroke:#b91c1c;stroke-width:2}.store{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.text{font:14px Arial;fill:#111827;text-anchor:middle}.small{font:12px Arial;fill:#4b5563;text-anchor:middle}.edge{stroke:#374151;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:7 5}</style>
  </defs>
  <rect x="10" y="10" width="1880" height="800" rx="12" fill="#fff" stroke="#374151" stroke-width="2"/>
  <text x="950" y="42" class="title" text-anchor="middle">D.2.2–D.2.3 — Split Planning &amp; Safe Action Loop</text>
  <rect class="box" x="40" y="150" width="195" height="90" rx="12"/><text class="text" x="138" y="181"><tspan x="138">Read ACTIVE</tspan><tspan x="138" dy="20">parents only</tspan></text>
  <rect class="box" x="285" y="150" width="220" height="90" rx="12"/><text class="text" x="395" y="181"><tspan x="395">Per-parent docs</tspan><tspan x="395" dy="20">+ index size</tspan></text>
  <rect class="box" x="555" y="150" width="225" height="90" rx="12"/><text class="text" x="668" y="181"><tspan x="668">desiredChildren</tspan><tspan x="668" dy="20">ceil(docs / target)</tspan></text>
  <polygon class="gate" points="910,195 1025,125 1140,195 1025,265"/><text class="text" x="1025" y="184"><tspan x="1025">children</tspan><tspan x="1025" dy="20">in 2..8?</tspan></text>
  <rect class="error" x="1235" y="70" width="230" height="85" rx="12"/><text class="text" x="1350" y="102"><tspan x="1350">&gt;8 or partial</tspan><tspan x="1350" dy="20">MANUAL_REQUIRED</tspan></text>
  <rect class="box" x="1225" y="220" width="250" height="85" rx="12"/><text class="text" x="1350" y="252"><tspan x="1350">Persist complete</tspan><tspan x="1350" dy="20">split_plan[]</tspan></text>
  <rect class="gate" x="1540" y="220" width="210" height="85" rx="12"/><text class="text" x="1645" y="252"><tspan x="1645">Next parent</tspan><tspan x="1645" dy="20">needs split?</tspan></text>
  <rect class="gate" x="1540" y="405" width="210" height="95" rx="12"/><text class="text" x="1645" y="438"><tspan x="1645">Pre-split gate</tspan><tspan x="1645" dy="20">health + 2.5× disk</tspan></text>
  <rect class="store" x="1195" y="410" width="250" height="85" rx="12"/><text class="text" x="1320" y="442"><tspan x="1320">Save intent</tspan><tspan x="1320" dy="20">async ID + expected</tspan></text>
  <rect class="box" x="880" y="410" width="240" height="85" rx="12"/><text class="text" x="1000" y="442"><tspan x="1000">SPLITSHARD</tspan><tspan x="1000" dy="20">async + rewrite</tspan></text>
  <rect class="box" x="580" y="410" width="220" height="85" rx="12"/><text class="text" x="690" y="442"><tspan x="690">REQUESTSTATUS</tspan><tspan x="690" dy="20">renew lease + poll</tspan></text>
  <polygon class="gate" points="420,452 510,390 600,452 510,514"/><text class="text" x="510" y="441"><tspan x="510">completed</tspan><tspan x="510" dy="20">without failure?</tspan></text>
  <rect class="gate" x="205" y="410" width="170" height="85" rx="12"/><text class="text" x="290" y="442"><tspan x="290">Post-split</tspan><tspan x="290" dy="20">topology gate</tspan></text>
  <rect class="store" x="205" y="610" width="220" height="90" rx="12"/><text class="text" x="315" y="642"><tspan x="315">Checkpoint VERIFIED</tspan><tspan x="315" dy="20">+ DELETESTATUS</tspan></text>
  <rect class="error" x="650" y="610" width="225" height="90" rx="12"/><text class="text" x="763" y="642"><tspan x="763">RETRY_WAIT</tspan><tspan x="763" dy="20">or MANUAL_REQUIRED</tspan></text>
  <rect class="box" x="1540" y="610" width="210" height="90" rx="12"/><text class="text" x="1645" y="642"><tspan x="1645">All parents done</tspan><tspan x="1645" dy="20">→ placement plan</tspan></text>
  <path class="edge" d="M235 195 H285"/><path class="edge" d="M505 195 H555"/><path class="edge" d="M780 195 H910"/>
  <path class="edge" d="M1090 155 L1235 112"/><text class="small" x="1165" y="119">NO</text><path class="edge" d="M1140 215 L1225 250"/><text class="small" x="1170" y="248">YES</text>
  <path class="edge" d="M1475 262 H1540"/><path class="edge" d="M1645 305 V405"/><text class="small" x="1670" y="356">YES</text>
  <path class="edge" d="M1540 452 H1445"/><path class="edge" d="M1195 452 H1120"/><path class="edge" d="M880 452 H800"/><path class="edge" d="M580 452 H600"/>
  <path class="edge" d="M420 452 H375"/><path class="edge" d="M290 495 V610"/><path class="edge" d="M425 655 C1080 760 1645 565 1645 500"/><text class="small" x="1050" y="744">next parent: refresh topology + resource gate</text>
  <path class="edge" d="M1600 305 C1530 350 1510 555 1585 610"/><text class="small" x="1520" y="540">NO</text>
  <path class="edge" d="M510 514 C530 590 610 635 650 650"/><text class="small" x="570" y="585">failed/notfound</text>
  <path class="edge" d="M290 495 C340 560 590 615 650 640"/><text class="small" x="475" y="571">gate failed</text>
  <path class="edge dash" d="M1320 495 C1280 580 1050 640 875 650"/>
  <text class="small" x="950" y="780">Never submit first and checkpoint later. A recovered worker adopts observed topology when it already matches expected_result.</text>
</svg>
